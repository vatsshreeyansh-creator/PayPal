<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradePoint Watchlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 900px">
  <h1 class="mb-4">TradePoint Watchlist</h1>
  <p class="text-secondary">Sample prices are simulated and are not live market prices.</p>
  <form id="search-form" class="input-group mb-3">
    <input id="query" class="form-control" placeholder="Stock name or symbol" maxlength="100" required>
    <button class="btn btn-primary" type="submit">Search Stocks</button>
  </form>
  <div id="status" class="mb-3" role="status"></div>
  <section id="results" class="list-group mb-4" aria-label="Search results"></section>
  <h2 class="h4">My Watchlist</h2>
  <div class="table-responsive">
    <table class="table align-middle bg-white">
      <thead><tr><th>Company</th><th>Symbol</th><th>Price</th><th>Quote</th><th></th></tr></thead>
      <tbody id="watchlist"></tbody>
    </table>
  </div>
</main>
<script>
// All network calls go to the Flask JSON API; rendering uses textContent to
// keep provider/company strings from being interpreted as HTML.
const statusBox = document.querySelector('#status');
const resultsBox = document.querySelector('#results');
const watchlistBox = document.querySelector('#watchlist');
const request = async (url, options = {}) => {
  let response;
  try {
    response = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
  } catch (_) {
    throw new Error('The server could not be reached.');
  }
  let body;
  try { body = await response.json(); }
  catch (_) { throw new Error('The server returned an invalid response.'); }
  if (!response.ok) throw new Error(body.error?.message || 'Request failed');
  return body;
};
const setStatus = (message, isError = false) => {
  statusBox.textContent = message;
  statusBox.className = isError ? 'mb-3 text-danger' : 'mb-3 text-secondary';
};
document.querySelector('#search-form').addEventListener('submit', async event => {
  event.preventDefault();
  resultsBox.replaceChildren();
  try {
    const data = await request('/api/stocks/search', {method: 'POST', body: JSON.stringify({query: document.querySelector('#query').value, limit: 20})});
    if (!data.results.length) { setStatus('No matching NSE stocks found.'); return; }
    setStatus('Select a stock to add it to your watchlist.');
    for (const stock of data.results) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'list-group-item list-group-item-action';
      button.textContent = `${stock.name} (${stock.symbol}) — Add`;
      button.addEventListener('click', async () => {
        try { await request('/api/watchlist', {method: 'POST', body: JSON.stringify({symbol: stock.symbol})}); setStatus(`${stock.symbol} added to watchlist.`); await loadWatchlist(); }
        catch (error) { setStatus(error.message, true); }
      });
      resultsBox.append(button);
    }
  } catch (error) { setStatus(error.message, true); }
});
async function loadWatchlist() {
  try {
    const data = await request('/api/watchlist');
    watchlistBox.replaceChildren();
    for (const item of data.items) {
      const row = document.createElement('tr');
      const values = [item.stock.name, item.stock.symbol,
        item.quote ? `${item.quote.price} ${item.quote.currency}` : '—',
        item.quote ? (item.quote.simulated ? 'Simulated quote' : 'Available') : 'Unavailable'];
      for (const value of values) { const cell = document.createElement('td'); cell.textContent = value; row.append(cell); }
      const actionCell = document.createElement('td');
      const removeButton = document.createElement('button'); removeButton.className = 'btn btn-sm btn-outline-danger'; removeButton.textContent = 'Remove';
      removeButton.addEventListener('click', async () => {
        try { await request(`/api/watchlist/${encodeURIComponent(item.stock.symbol)}`, {method: 'DELETE'}); await loadWatchlist(); }
        catch (error) { setStatus(error.message, true); }
      });
      actionCell.append(removeButton); row.append(actionCell); watchlistBox.append(row);
    }
  } catch (error) { setStatus(error.message, true); }
}
loadWatchlist();
</script>
</body>
</html>
